name: JARVIS CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: jarvis-ci-${{ github.ref }}
  # Keep emulator boot/test runs alive when a newer commit arrives on the same ref.
  cancel-in-progress: false

jobs:
  static-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Python syntax
        run: python -m compileall -q app/src/main/python
      - name: Shell syntax
        run: |
          find scripts tools -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
      - name: Structured metadata checks
        run: bash tools/verify_release.sh
      - name: Source contract checks
        run: |
          python tools/test_source_contracts.py
          python tools/test_native_apk_verifier.py
      - name: XML parse gate
        run: |
          python - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          for p in pathlib.Path("app/src/main").rglob("*.xml"):
              ET.parse(p)
          print("XML parse gate passed")
          PY
      - name: Secret scan
        run: |
          ! grep -RInE --exclude-dir=.git --exclude='*.md'             '(AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----|ghp_[A-Za-z0-9]{30,})' .
      - name: Sensitive capability scan
        run: |
          ! grep -RInE --include='AndroidManifest.xml'             'MANAGE_EXTERNAL_STORAGE|QUERY_ALL_PACKAGES|BIND_ACCESSIBILITY_SERVICE|FOREGROUND_SERVICE_DATA_SYNC|ACCESS_BACKGROUND_LOCATION' .

  wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify complete wrapper
        run: bash tools/check_wrapper.sh

  gradle-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Python 3.10 for Chaquopy
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - uses: android-actions/setup-android@v4
      - name: Install Android build prerequisites
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0"             "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Fetch and build pinned llama.cpp
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: bash scripts/build_llama.sh
      - name: Fetch and build pinned whisper.cpp
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: bash scripts/build_whisper.sh
      - name: Verify native dependencies and 16 KiB alignment
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: bash tools/verify_native_libs.sh
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest
      - name: Lint
        run: ./gradlew :app:lintDebug
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug
      - name: Verify packaged native libraries
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: bash tools/verify_native_apk.sh
      - name: Assemble release
        run: ./gradlew :app:assembleRelease
      - name: Reclaim disk space for Android emulator
        run: |
          set -euo pipefail
          echo "Disk usage before cleanup:"
          df -h "$HOME" "$RUNNER_TEMP"

          # These toolchains are preinstalled on GitHub-hosted runners but are
          # not used by this Android/Java/Chaquopy workflow.
          for path in /usr/share/dotnet /usr/local/share/boost /opt/ghc; do
            if sudo test -d "$path"; then
              sudo du -sh "$path" || true
              sudo rm -rf "$path"
            fi
          done
          sudo apt-get clean

          echo "Disk usage after cleanup:"
          df -h "$HOME" "$RUNNER_TEMP"
          available_mb="$(df -BM --output=avail "$HOME" | tail -n 1 | tr -cd '0-9')"
          if [[ "$available_mb" -lt 5120 ]]; then
            echo "::error::Only ${available_mb} MiB free before emulator setup; need at least 5120 MiB for the API 35 system image and a bounded userdata partition."
            exit 1
          fi
      - name: Enable KVM for instrumented tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          # The hosted runner had only 4503 MiB free while the default AVD
          # requested 7372 MiB for userdata. Bound userdata for CI tests.
          disk-size: 3072M
          emulator-options: -no-snapshot-save -no-snapshot-load -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          emulator-boot-timeout: 900
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: android-actions/setup-android@v4
      - name: Install native build prerequisites
        run: sdkmanager "platforms;android-31" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Verify native lockfile
        run: |
          grep -q '526c43b8f7dfea9032e9f35e7a1be9183ca7cc20' third_party/LOCKFILE
          grep -q '927cfce34f31707e17f2bff35c349632fb9e2c3a' third_party/LOCKFILE
      - name: Build pinned native dependencies
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          bash scripts/build_llama.sh
          bash scripts/build_whisper.sh
      - name: Verify native dependencies and 16 KiB alignment
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: bash tools/verify_native_libs.sh

  license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate licensing split
        run: bash tools/test_license_split.sh
