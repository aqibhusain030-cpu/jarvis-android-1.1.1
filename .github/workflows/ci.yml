name: JARVIS CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: jarvis-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Python syntax
        run: python -m compileall -q app/src/main/python
      - name: Shell syntax
        run: |
          for f in scripts/*.sh tools/*.sh; do
            bash -n "$f"
          done
      - name: Structured metadata checks
        run: bash tools/verify_release.sh
      - name: Source contract checks
        run: python tools/test_source_contracts.py
      - name: XML parse gate
        run: |
          python - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          for p in pathlib.Path("app/src/main").rglob("*.xml"):
              ET.parse(p)
          print("XML parse gate passed")
          PY
      - name: Secret scan
        run: |
          ! grep -RInE --exclude-dir=.git --exclude='*.md'             '(AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----|ghp_[A-Za-z0-9]{30,})' .
      - name: Sensitive capability scan
        run: |
          ! grep -RInE --include='AndroidManifest.xml'             'MANAGE_EXTERNAL_STORAGE|QUERY_ALL_PACKAGES|FOREGROUND_SERVICE_DATA_SYNC|ACCESS_BACKGROUND_LOCATION' .
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p = Path("app/src/main/AndroidManifest.xml")
          root = ET.parse(p).getroot()
          ns = {"android": "http://schemas.android.com/apk/res/android"}
          services = [
              s for s in root.findall(".//service")
              if s.get("{http://schemas.android.com/apk/res/android}permission")
              == "android.permission.BIND_ACCESSIBILITY_SERVICE"
          ]
          assert len(services) <= 1, "At most one accessibility service is permitted."
          for service in services:
              assert service.get("{http://schemas.android.com/apk/res/android}exported") == "false"
          print("Accessibility service declaration gate passed")
          PY

  wrapper:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Verify complete wrapper
        run: bash tools/check_wrapper.sh

  gradle-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Python 3.10 for Chaquopy
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - uses: android-actions/setup-android@v4
      - name: Install Android build prerequisites
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0"             "ndk;26.1.10909125" "cmake;3.22.1"
      - name: Fetch and build pinned llama.cpp
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: bash scripts/build_llama.sh
      - name: Fetch and build pinned whisper.cpp
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: bash scripts/build_whisper.sh
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest
      - name: Lint
        run: ./gradlew :app:lintDebug
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug
      - name: Assemble release
        run: ./gradlew :app:assembleRelease
      - name: Upload APK artifacts before emulator tests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jarvis-android-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Reclaim runner disk space for emulator
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false
          tool-cache: false
          dotnet: true
          haskell: true
          swap-storage: false
          docker-images: false
          large-packages: false
      - name: Verify toolchain after disk cleanup
        run: |
          test -x "$JAVA_HOME/bin/java"
          java -version
          python --version
          df -h /
      - name: Enable KVM for instrumented tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          disk-size: 2048M
          emulator-options: -no-snapshot-save -no-snapshot-load -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          emulator-boot-timeout: 900
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace

  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: android-actions/setup-android@v4
      - name: Install native build prerequisites
        run: sdkmanager "platforms;android-31" "ndk;26.1.10909125" "cmake;3.22.1"
      - name: Verify native lockfile
        run: |
          grep -q '526c43b8f7dfea9032e9f35e7a1be9183ca7cc20' third_party/LOCKFILE
          grep -q '927cfce34f31707e17f2bff35c349632fb9e2c3a' third_party/LOCKFILE
      - name: Build pinned native dependencies
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: |
          bash scripts/build_llama.sh
          bash scripts/build_whisper.sh

  license:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate licensing split
        run: bash tools/test_license_split.sh
