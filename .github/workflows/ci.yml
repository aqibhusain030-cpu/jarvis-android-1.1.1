name: JARVIS CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax
        run: python -m compileall -q app/src/main/python
      - name: Shell syntax
        run: |
          for f in scripts/*.sh tools/*.sh; do
            bash -n "$f"
          done
      - name: Structured metadata checks
        run: bash tools/verify_release.sh
      - name: Secret scan
        run: |
          ! grep -RInE --exclude-dir=.git --exclude='*.md' \
            '(AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----|ghp_[A-Za-z0-9]{30,})' .
      - name: Sensitive capability scan
        run: |
          ! grep -RInE --include='AndroidManifest.xml' \
            'MANAGE_EXTERNAL_STORAGE|QUERY_ALL_PACKAGES|BIND_ACCESSIBILITY_SERVICE|FOREGROUND_SERVICE_DATA_SYNC|ACCESS_BACKGROUND_LOCATION' .

  wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify complete wrapper
        run: bash tools/check_wrapper.sh

  gradle-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android build prerequisites
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0" \
            "ndk;26.1.10909125" "cmake;3.22.1"
      - name: Fetch and build pinned llama.cpp
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: bash scripts/build_llama.sh
      - name: Fetch and build pinned whisper.cpp
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: bash scripts/build_whisper.sh
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest
      - name: Lint
        run: ./gradlew :app:lintDebug
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: android-actions/setup-android@v4
      - name: Install native build prerequisites
        run: sdkmanager "platforms;android-31" "ndk;26.1.10909125" "cmake;3.22.1"
      - name: Verify native lockfile
        run: |
          grep -q '526c43b8f7dfea9032e9f35e7a1be9183ca7cc20' third_party/LOCKFILE
          grep -q '927cfce34f31707e17f2bff35c349632fb9e2c3a' third_party/LOCKFILE
      - name: Build pinned native dependencies
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: |
          bash scripts/build_llama.sh
          bash scripts/build_whisper.sh

  license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate licensing split
        run: bash tools/test_license_split.sh
